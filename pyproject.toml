[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-engine"
version = "1.0.0"
description = "AI Powered Content Engine for all types of content creation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Content Engine Team", email = "team@contentengine.ai"}
]
keywords = [
    "ai",
    "content",
    "generation",
    "social-media",
    "marketing",
    "automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Marketing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Utilities"
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "openai>=1.3.0",
    "anthropic>=0.3.0",
    "google-generativeai>=0.3.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "pandas>=2.1.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "autoflake>=2.2.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]
local-llm = [
    "llama-cpp-python>=0.2.0",
]

[project.scripts]
content-engine = "content_engine.cli:main"

[project.urls]
Homepage = "https://github.com/xghstrider/Content-engine"
Documentation = "https://github.com/xghstrider/Content-engine#readme"
Repository = "https://github.com/xghstrider/Content-engine"
Issues = "https://github.com/xghstrider/Content-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["content_engine*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.vercel]
entrypoint = "content_engine.api:app"
